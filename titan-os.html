<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Titan OS Hardcore</title><link rel="manifest" href="data:application/json,{
  'name':'Titan OS',
  'short_name':'Titan',
  'start_url':'.',
  'display':'fullscreen',
  'background_color':'#1a1a1a',
  'theme_color':'#00f2ff',
  'icons':[{
    'src':'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 fill=%22%231a1a1a%22/%3E%3Crect x=%2210%22 y=%2210%22 width=%2280%22 height=%2280%22 fill=%22none%22 stroke=%22%2300f2ff%22 stroke-width=%228%22 rx=%2220%22/%3E%3Ctext x=%2250%22 y=%2270%22 text-anchor=%22middle%22 fill=%22%2300f2ff%22 font-size=%2250%22 font-family=%22Arial%22%3ET%3C/text%3E%3C/svg%3E',
    'sizes':'512x512',
    'type':'image/svg+xml'
  }]
}">
    <style>
        /* ЦВЕТОВАЯ СХЕМА И ПЕРЕМЕННЫЕ 
           Сделал обводку еще более выразительной.
        */
        :root {
            --t-bg: #1a1a1a;
            --t-accent: #00f2ff;
            --t-dark: #000000;
            --t-win-bg: #ffffff;
            --t-border: 4px solid var(--t-accent);
            --t-radius: 24px;
        }

        /* БАЗОВЫЕ НАСТРОЙКИ СТРАНИЦЫ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Segoe UI', Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            background: var(--t-bg);
            color: #fff;
            overflow: hidden; /* Весь экран статичен */
        }

        /* СЕТКА НА ЗАДНЕМ ПЛАНЕ */
        .system-grid {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(0, 242, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 255, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
        }

        /* РАБОЧИЙ СТОЛ 
           Добавлена поддержка бесконечного скролла вниз.
        */
        #desktop-surface {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: calc(100% - 90px); /* Место для таскбара */
            padding: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            grid-auto-rows: 135px;
            gap: 25px;
            overflow-y: auto; 
            z-index: 5;
            scroll-behavior: smooth;
        }

        /* Скрываем полосу прокрутки для Android */
        #desktop-surface::-webkit-scrollbar { width: 0; height: 0; }

        /* ЭЛЕМЕНТ ПРИЛОЖЕНИЯ */
        .app-shortcut {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            text-align: center;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .app-shortcut:active {
            transform: scale(0.85);
        }

        .icon-wrapper {
            width: 85px;
            height: 85px;
            background: rgba(0,0,0,0.85);
            border: var(--t-border);
            border-radius: var(--t-radius);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            overflow: hidden;
            position: relative;
        }

        .icon-wrapper img {
            width: 70%;
            height: 70%;
            object-fit: contain;
        }

        .icon-wrapper span {
            font-size: 40px;
            font-weight: 900;
            color: var(--t-accent);
        }

        .app-title {
            font-size: 12px;
            font-weight: 800;
            color: #fff;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 2px 2px 4px #000;
        }

        /* ОКНА СИСТЕМЫ 
        */
        .titan-window {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: calc(100% - 90px);
            background: var(--t-win-bg);
            z-index: 1000;
            display: none;
            flex-direction: column;
            animation: win-up 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        }

        @keyframes win-up {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .win-bar {
            height: 65px;
            background: var(--t-dark);
            display: flex;
            align-items: center;
            padding: 0 20px;
            border-bottom: var(--t-border);
        }

        .win-name {
            flex: 1;
            color: var(--t-accent);
            font-weight: 900;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .win-close {
            width: 55px;
            height: 45px;
            background: #ff3b30;
            border: none;
            border-radius: 14px;
            color: #fff;
            font-size: 22px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 0 #8b110b;
            cursor: pointer;
        }

        .win-close:active {
            transform: translateY(2px);
            box-shadow: none;
        }

        .win-body {
            flex: 1;
            width: 100%;
            background: #fff;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* ПАНЕЛЬ УПРАВЛЕНИЯ (TASKBAR) 
        */
        #task-dock {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 90px;
            background: #050505;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 2px solid #222;
            z-index: 5000;
        }

        .dock-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #444;
            transition: 0.3s;
            cursor: pointer;
        }

        .dock-item.active {
            color: var(--t-accent);
        }

        .dock-item b {
            font-size: 32px;
            font-style: normal;
        }

        .dock-item span {
            font-size: 10px;
            font-weight: 900;
            text-transform: uppercase;
            margin-top: 5px;
        }

        /* ДИЗАЙН СТРАНИЦ МАРКЕТА И НАСТРОЕК 
        */
        .system-page {
            width: 100%;
            height: 100%;
            background: #f9f9f9;
            color: #111;
            padding: 30px;
            overflow-y: auto; /* ВКЛЮЧАЕМ СКРОЛЛ ЗДЕСЬ */
        }

        .system-page::-webkit-scrollbar { width: 6px; }
        .system-page::-webkit-scrollbar-thumb { background: var(--t-accent); border-radius: 10px; }

        .big-title {
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 25px;
            border-left: 12px solid var(--t-accent);
            padding-left: 15px;
            color: #000;
        }

        .card-ui {
            background: #fff;
            border: 2px solid #eee;
            border-radius: 25px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        .input-ui {
            width: 100%;
            padding: 18px;
            border: 2px solid #ddd;
            border-radius: 15px;
            font-size: 16px;
            margin-bottom: 15px;
            background: #fafafa;
        }

        .input-ui:focus {
            border-color: var(--t-accent);
            outline: none;
        }

        .btn-ui {
            width: 100%;
            padding: 20px;
            background: #000;
            color: #fff;
            border: none;
            border-radius: 18px;
            font-weight: 900;
            font-size: 14px;
            letter-spacing: 1px;
            cursor: pointer;
        }

        .btn-ui:active {
            transform: scale(0.98);
        }

        /* СЕТКА ПРИЛОЖЕНИЙ В МАРКЕТЕ */
        .market-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .market-card {
            background: #fff;
            border: 2px solid #eee;
            border-radius: 25px;
            padding: 20px;
            text-align: center;
        }

        .market-card img {
            width: 50px;
            height: 50px;
            margin-bottom: 15px;
        }

        .market-card b {
            display: block;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .market-card button {
            width: 100%;
            padding: 12px;
            background: var(--t-accent);
            border: none;
            border-radius: 12px;
            font-weight: 900;
            font-size: 11px;
            color: #000;
            cursor: pointer;
        }

        .market-card button:active {
            transform: scale(0.95);
        }

        /* УВЕДОМЛЕНИЕ */
        #titan-toast {
            position: fixed;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--t-accent);
            color: #000;
            padding: 18px 35px;
            border-radius: 50px;
            font-weight: 900;
            font-size: 14px;
            display: none;
            z-index: 9999;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body onload="boot()">

    <div class="system-grid"></div>

    <div id="desktop-surface"></div>

    <div id="task-dock">
        <div class="dock-item active" id="dock-home" onclick="nav('home')">
            <b>🏠</b><span>Рабочий стол</span>
        </div>
        <div class="dock-item" id="dock-market" onclick="nav('market')">
            <b>🛒</b><span>Маркет</span>
        </div>
        <div class="dock-item" id="dock-settings" onclick="nav('settings')">
            <b>⚙️</b><span>Настройки</span>
        </div>
    </div>

    <div id="win-market" class="titan-window">
        <div class="win-bar">
            <div class="win-name">Titan Store</div>
            <button class="win-close" onclick="nav('home')">✕</button>
        </div>
        <div class="win-body">
            <div class="system-page">
                <h1 class="big-title">Новое ПО</h1>
                <div class="card-ui">
                    <input type="text" id="add-n" class="input-ui" placeholder="Название">
                    <input type="text" id="add-u" class="input-ui" placeholder="адрес.ком">
                    <button class="btn-ui" onclick="manualInstall()">УСТАНОВИТЬ В TITAN OS</button>
                </div>

                <h1 class="big-title">Доступно</h1>
                <div class="market-list" id="market-render">
                    </div>
            </div>
        </div>
    </div>

    <div id="win-settings" class="titan-window">
        <div class="win-bar">
            <div class="win-name">Настройки</div>
            <button class="win-close" onclick="nav('home')">✕</button>
        </div>
        <div class="win-body">
            <div class="system-page">
                <h1 class="big-title">Персонализация</h1>
                <div class="card-ui">
                    <p style="font-weight: bold; margin-bottom: 15px;">Цвет обводки и неона</p>
                    <input type="color" id="color-picker" class="input-ui" style="height: 80px; padding: 5px;" onchange="updateTheme()">
                </div>

                <h1 class="big-title">Управление</h1>
                <button class="btn-ui" style="background: #333; margin-bottom: 20px;" onclick="location.reload()">МЯГКАЯ ПЕРЕЗАГРУЗКА</button>
                <button class="btn-ui" style="background: #ff3b30;" onclick="fullWipe()">ОЧИСТИТЬ ВСЕ ДАННЫЕ</button>
            </div>
        </div>
    </div>

    <div id="app-runtime-layer"></div>
    <div id="titan-toast"></div>

    <script>
        /* ЯДРО СИСТЕМЫ 
        */

        var db = JSON.parse(localStorage.getItem('titan_v10_db')) || [];
        var color = localStorage.getItem('titan_v10_color') || '#00f2ff';

        // КАТАЛОГ С ТОЧНО РАБОЧИМИ СЕРВИСАМИ
        var catalog = [
            {n: 'Google', u: 'google.com'},
            {n: 'Wikipedia', u: 'ru.m.wikipedia.org'},
            {n: 'Gismeteo', u: 'www.gismeteo.ru'},
            {n: 'Radio Garden', u: 'radio.garden'},
            {n: 'Калькулятор', u: 'desmos.com/calculator'}
        ];

        function boot() {
            document.documentElement.style.setProperty('--t-accent', color);
            var picker = document.getElementById('color-picker');
            if(picker) picker.value = color;
            renderDesk();
            renderStore();
        }

        function renderDesk() {
            var surf = document.getElementById('desktop-surface');
            var runtime = document.getElementById('app-runtime-layer');
            if(!surf || !runtime) return;
            surf.innerHTML = '';
            runtime.innerHTML = '';

            db.forEach(function(app, i) {
                // СОЗДАЕМ ИКОНКУ
                var item = document.createElement('div');
                item.className = 'app-shortcut';
                item.onclick = function() { openApp(i); };
                item.oncontextmenu = function(e) {
                    e.preventDefault();
                    if(confirm("Удалить приложение " + app.n + "?")) deleteApp(i);
                };

                var favicon = "https://www.google.com/s2/favicons?sz=128&domain=" + app.u;
                item.innerHTML = `
                    <div class="icon-wrapper">
                        <img src="${favicon}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                        <span style="display:none">${app.n.charAt(0)}</span>
                    </div>
                    <div class="app-title">${app.n}</div>
                `;
                surf.appendChild(item);

                // СОЗДАЕМ СКРЫТОЕ ОКНО
                var win = document.createElement('div');
                win.id = 'titan-win-' + i;
                win.className = 'titan-window';

                var finalUrl = app.u.indexOf('http') === 0 ? app.u : 'https://' + app.u;
                if(finalUrl.indexOf('google.com') > -1) finalUrl += (finalUrl.indexOf('?') > -1 ? '&' : '?') + 'igu=1';

                win.innerHTML = `
                    <div class="win-bar">
                        <div class="win-name">${app.n}</div>
                        <button class="win-close" onclick="nav('home')">✕</button>
                    </div>
                    <div class="win-body">
                        <iframe src="${finalUrl}" sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-modals"></iframe>
                    </div>
                `;
                runtime.appendChild(win);
            });
        }

        function renderStore() {
            var list = document.getElementById('market-render');
            if(!list) return;
            list.innerHTML = '';
            catalog.forEach(function(app) {
                var icon = "https://www.google.com/s2/favicons?sz=64&domain=" + app.u;
                list.innerHTML += `
                    <div class="market-card">
                        <img src="${icon}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 fill=%22%23000%22/%3E%3Ctext x=%2250%22 y=%2270%22 text-anchor=%22middle%22 fill=%22%2300f2ff%22 font-size=%2250%22%3E${app.n.charAt(0)}%3C/text%3E%3C/svg%3E';">
                        <b>${app.n}</b>
                        <button onclick="install('${app.n.replace(/'/g, "\\'")}', '${app.u.replace(/'/g, "\\'")}')">УСТАНОВИТЬ</button>
                    </div>
                `;
            });
        }

        function nav(page) {
            hideAll();
            var items = document.getElementsByClassName('dock-item');
            for(var i=0; i<items.length; i++) items[i].classList.remove('active');

            if(page === 'home') {
                var dockHome = document.getElementById('dock-home');
                if(dockHome) dockHome.classList.add('active');
            } else if(page === 'market') {
                var winMarket = document.getElementById('win-market');
                var dockMarket = document.getElementById('dock-market');
                if(winMarket) winMarket.style.display = 'flex';
                if(dockMarket) dockMarket.classList.add('active');
            } else if(page === 'settings') {
                var winSettings = document.getElementById('win-settings');
                var dockSettings = document.getElementById('dock-settings');
                if(winSettings) winSettings.style.display = 'flex';
                if(dockSettings) dockSettings.classList.add('active');
            }
        }

        function openApp(id) {
            hideAll();
            var win = document.getElementById('titan-win-' + id);
            if(win) win.style.display = 'flex';
        }

        function hideAll() {
            var ws = document.getElementsByClassName('titan-window');
            for(var i=0; i<ws.length; i++) ws[i].style.display = 'none';
            var runtimeWins = document.getElementById('app-runtime-layer');
            if(runtimeWins) {
                var allWins = runtimeWins.getElementsByClassName('titan-window');
                for(var i=0; i<allWins.length; i++) allWins[i].style.display = 'none';
            }
        }

        function install(n, u) {
            db.push({n: n, u: u});
            save(); 
            renderDesk();
            toast("Установлено!");
        }

        function manualInstall() {
            var nInput = document.getElementById('add-n');
            var uInput = document.getElementById('add-u');
            var n = nInput ? nInput.value : '';
            var u = uInput ? uInput.value : '';
            if(n && u) {
                install(n, u);
                if(nInput) nInput.value = '';
                if(uInput) uInput.value = '';
            } else {
                toast("Заполните оба поля!");
            }
        }

        function deleteApp(i) {
            db.splice(i, 1);
            save(); 
            renderDesk();
            toast("Приложение удалено");
        }

        function save() { 
            localStorage.setItem('titan_v10_db', JSON.stringify(db)); 
        }

        function updateTheme() {
            var picker = document.getElementById('color-picker');
            if(picker) color = picker.value;
            localStorage.setItem('titan_v10_color', color);
            document.documentElement.style.setProperty('--t-accent', color);
            renderDesk();
            toast("Цвет обновлен");
        }

        function fullWipe() {
            if(confirm("Сбросить всё? Это удалит все приложения.")) {
                localStorage.clear();
                location.reload();
            }
        }

        function toast(msg) {
            var t = document.getElementById('titan-toast');
            if(!t) return;
            t.innerText = msg; 
            t.style.display = 'block';
            setTimeout(function() { 
                if(t) t.style.display = 'none'; 
            }, 2000);
        }
    </script>
  <script>
if ('serviceWorker' in navigator) {
    const swCode = `
        self.addEventListener('install', e => {
            e.waitUntil(self.skipWaiting());
        });
        self.addEventListener('activate', e => {
            e.waitUntil(self.clients.claim());
        });
        self.addEventListener('fetch', e => {
            e.respondWith(fetch(e.request).catch(() => {
                return new Response('Titan OS Offline', {
                    status: 200,
                    headers: {'Content-Type': 'text/html'}
                });
            }));
        });
    `;
    const blob = new Blob([swCode], {type: 'application/javascript'});
    const swUrl = URL.createObjectURL(blob);
    navigator.serviceWorker.register(swUrl, {scope: '/'});
}
  </script>
</body>
</html>
